name: Deploy API to Docker Hub and k3s

on:
  workflow_call:
    inputs:
      image-name:
        required: true
        type: string
      image-tag:
        required: true
        type: string
    secrets:
      DOCKER_USERNAME:
        required: true
      DOCKER_PASSWORD:
        required: true
      AWS_HOST:
        required: true
      EA2_SSH_PRIVATE_KEY:
        required: true

jobs:
  deps-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias
        run: npm install

      - name: Ejecutar pruebas
        run: npm test

  build-and-push:
    runs-on: ubuntu-latest
    needs: deps-and-test

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Login Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker image
        run: |
          IMAGE="${{ secrets.DOCKER_USERNAME }}/${{ inputs.image-name }}"
          docker build -t "$IMAGE:${{ inputs.image-tag }}" -t "$IMAGE:latest" .
          docker push --all-tags "$IMAGE"

  deploy-to-k3s:
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Deploy to k3s
        id: deploy
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ubuntu
          key: ${{ secrets.EA2_SSH_PRIVATE_KEY }}
          script: |
            sudo kubectl apply -f k8s/lab-3.2/00-namespace.yaml
            sudo kubectl apply -f k8s/lab-3.2/01-deployment-v1.yaml
            sudo kubectl apply -f k8s/lab-3.2/02-service.yaml
            sudo kubectl rollout status deployment/demo-api -n lab32 --timeout=60s

      - name: Rollback automático
        if: failure()
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ubuntu
          key: ${{ secrets.EA2_SSH_PRIVATE_KEY }}
          script: |
            sudo kubectl rollout undo deployment/demo-api -n lab32
            sudo kubectl rollout status deployment/demo-api -n lab32 --timeout=60s