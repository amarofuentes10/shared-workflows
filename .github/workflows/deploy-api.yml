name: Deploy API Blue Green to Docker Hub and k3s

on:
  workflow_call:
    inputs:
      image-name:
        required: true
        type: string
      image-tag:
        required: true
        type: string
      namespace:
        required: false
        type: string
        default: lab32
      green-deployment:
        required: false
        type: string
        default: demo-api-green
      service-name:
        required: false
        type: string
        default: demo-api-bg-svc
      container-name:
        required: false
        type: string
        default: api
    secrets:
      DOCKER_USERNAME:
        required: true
      DOCKER_PASSWORD:
        required: true
      AWS_HOST:
        required: true
      EA2_SSH_PRIVATE_KEY:
        required: true

jobs:
  deps-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias
        run: npm install

      - name: Ejecutar pruebas
        run: npm test

  build-and-push:
    runs-on: ubuntu-latest
    needs: deps-and-test
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker image
        run: |
          IMAGE="${{ secrets.DOCKER_USERNAME }}/${{ inputs.image-name }}"
          docker build -t "$IMAGE:${{ inputs.image-tag }}" -t "$IMAGE:latest" .
          docker push "$IMAGE:${{ inputs.image-tag }}"
          docker push "$IMAGE:latest"

  deploy-blue-green:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Deploy Green, health check and switch traffic
        id: deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ubuntu
          key: ${{ secrets.EA2_SSH_PRIVATE_KEY }}
          script: |
            set -e

            IMAGE="${{ secrets.DOCKER_USERNAME }}/${{ inputs.image-name }}:${{ inputs.image-tag }}"
            NAMESPACE="${{ inputs.namespace }}"
            GREEN="${{ inputs.green-deployment }}"
            SERVICE="${{ inputs.service-name }}"
            CONTAINER="${{ inputs.container-name }}"

            echo "1. Updating Green deployment with image: $IMAGE"
            sudo kubectl set image deployment/$GREEN $CONTAINER=$IMAGE -n $NAMESPACE

            echo "2. Waiting for Green rollout status"
            sudo kubectl rollout status deployment/$GREEN -n $NAMESPACE --timeout=90s

            echo "3. Listing Green pods"
            sudo kubectl get pods -l app=demo-api,slot=green -n $NAMESPACE

            echo "4. Switching service traffic from Blue to Green"
            sudo kubectl patch service $SERVICE -n $NAMESPACE -p '{"spec":{"selector":{"app":"demo-api","slot":"green"}}}'

            echo "5. Blue/Green deployment completed successfully"
            sudo kubectl get svc $SERVICE -n $NAMESPACE
            sudo kubectl get pods -n $NAMESPACE

      - name: Automatic rollback if Green validation fails
        if: failure()
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ubuntu
          key: ${{ secrets.EA2_SSH_PRIVATE_KEY }}
          script: |
            NAMESPACE="${{ inputs.namespace }}"
            GREEN="${{ inputs.green-deployment }}"
            SERVICE="${{ inputs.service-name }}"

            echo "Rollback started: restoring Green deployment and keeping traffic on Blue"
            sudo kubectl rollout undo deployment/$GREEN -n $NAMESPACE || true
            sudo kubectl patch service $SERVICE -n $NAMESPACE -p '{"spec":{"selector":{"app":"demo-api","slot":"blue"}}}' || true
            sudo kubectl get svc $SERVICE -n $NAMESPACE